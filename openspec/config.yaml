schema: spec-driven
context: |
  Project: hackatwin-x402-team1-avalanche (x402 payments on Avalanche; design phase, no app code yet).
  Stack (planned): pnpm workspaces, TypeScript strict, hexagonal architecture with repo-wide DI,
  Next.js frontend, Docusaurus docs (apps/docs), Foundry contracts (Wonderland boilerplate, solc 0.8.30, evm cancun, OZ 5.7.0).
  Tests (planned): Vitest unit/integration, TS E2E (Vitest + viem + anvil), Playwright, Foundry (forge test).
  Source of truth: docs/decisions.md (Q1-Q20), docs/standards/smart-contracts.md, docs/demos.md.
  Conventions: English artifacts, Conventional Commits, gitflow (main/develop/feature/<name>),
  issue -> branch -> commits -> PR -> merge, no AI attribution, one-line code comments or none, KISS/DRY.
strict_tdd: true
testing:
  strict_tdd: true
  strict_tdd_scope: contracts
  note: Strict TDD is mandatory for Solidity (Q21). TypeScript code needs tests but not strict TDD. forge is installed; the command works once a Foundry project exists.
  runner:
    planned: [vitest, forge test]
    command: forge test
  layers:
    unit: {available: false, planned: "Vitest, forge test"}
    integration: {available: false, planned: "Vitest, forge test (fork)"}
    e2e: {available: false, planned: "Vitest + viem + anvil, Playwright"}
  coverage: {available: false, planned: "vitest --coverage, forge coverage"}
  quality:
    linter: {available: false, planned: "solhint-config-wonderland, lintspec"}
    type_checker: {available: false, planned: "tsc --noEmit"}
    formatter: {available: false, planned: "forge fmt"}
  global_tools_present: [pnpm, node, forge, anvil]
review_budget_lines: 400
delivery_strategy: ask-on-risk
rules:
  proposal:
    - Reference the relevant decision IDs (Qn) from docs/decisions.md.
  specs:
    - Use Given/When/Then scenarios; write in English.
  design:
    - Respect hexagonal boundaries and repo-wide DI; contracts follow docs/standards/smart-contracts.md.
  tasks:
    - Forecast against the 400-line review budget; split into chained PRs when high.
  apply:
    - Conventional Commits with module scope and issue footer; no AI attribution; no middle dot character (U+00B7).
    - "Contracts: strict TDD. Write the Bulloak .tree, scaffold it, see the forge test fail (red), implement until green, then refactor."
  verify:
    - Run available test commands; report unavailable layers explicitly.
  archive:
    - Merge deltas into openspec/specs before moving the change to archive.
