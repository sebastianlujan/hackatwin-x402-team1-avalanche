 case 'pair':return `<div class="pair-grid">${b.map((x,i)=>`<section class="pair-item animate" style="--i:${i+2}"><span class="label">0${i+1}</span><h2>${esc(x[0])}</h2><p>${esc(x[1])}</p><p>${esc(x[2])}</p></section>`).join('')}</div>`;
 case 'cards':return `<div class="cards">${b.map((x,i)=>`<section class="card animate" style="--i:${i+2}"><span class="label">${esc(x[0])}</span><h2>${esc(x[1])}</h2><p>${esc(x[2])}</p></section>`).join('')}</div>`;
 case 'steps':return `<div class="steps">${b.map((x,i)=>`<section class="step animate" style="--i:${i+2}"><span class="n">0${i+1}</span><h2>${esc(x[0])}</h2><p>${esc(x[1])}</p></section>`).join('')}</div>`;
 case 'code':return `<div class="code-wrap animate" style="--i:2"><div class="code-bar"><i></i><i></i><i></i><span>${s.annex?'REFERENCIA':'DEMO'}</span></div><pre>${esc(b)}</pre></div>`;
 case 'demo':return `<div class="demo-list">${b.map((x,i)=>`<section class="demo-row animate" style="--i:${i+2}"><span class="n">${esc(x[0])}</span><h2>${esc(x[1])}</h2><p>${esc(x[2])}</p></section>`).join('')}</div>`;
 case 'network':return `<div class="network-map"><div class="primary-box animate" style="--i:2"><p class="map-label">PRIMARY NETWORK</p><div class="chains"><div class="chain"><b>C-Chain</b><span>Contratos EVM</span></div><div class="chain"><b>P-Chain</b><span>Validadores y L1</span></div><div class="chain"><b>X-Chain</b><span>Activos nativos</span></div></div></div><div class="icm animate" style="--i:3">ICM</div><div class="l1s"><div class="l1 animate" style="--i:4">L1 A<span>Reglas y validadores propios</span></div><div class="l1 animate" style="--i:5">L1 B<span>Reglas y validadores propios</span></div></div></div>`;
 case 'sequence':return `<div class="sequence-grid"><div class="actor">CLIENTE</div><div class="actor">SERVIDOR</div><div class="actor">FACILITATOR</div>${[['Solicita recurso',''],['402 + condiciones','back'],['Reintenta + autorización',''],['Verificar + liquidar','right'],['Resultado','right back'],['Recurso + evidencia','back']].map((x,i)=>`<div class="message animate ${x[1]}" style="--i:${i+2}">${esc(x[0])}</div>`).join('')}</div>`;
 case 'table':return `<table class="animate" style="--i:2"><thead><tr><th>Enfoque</th><th>Aporta</th><th>Requiere además</th></tr></thead><tbody>${b.map(x=>`<tr>${x.map(y=>`<td>${esc(y)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
 case 'links':return `<div class="links">${b.map((x,i)=>`<a class="resource animate" style="--i:${i+2}" href="${esc(x[1])}" target="_blank" rel="noopener noreferrer">${esc(x[0])}<span>↗</span></a>`).join('')}</div>`;
 }
}
function readHash(){const m=location.hash.match(/^#([12])-(\d+)/);if(!m)return;const c=+m[1]-1,i=(c?D[0].slides.length:0)+ +m[2]-1;if(slides[i]?.chapter!==c)return;annex=location.hash.includes('annex=1')||slides[i].annex;current=i;}
function render(){$('stage').classList.toggle('initial',firstRender);firstRender=false;const s=slides[current],q=seq(),p=q.indexOf(current);$('stage').innerHTML=`<article class="slide ${s.layout==='hero'?'hero':'layout-'+s.layout}"><div class="eyebrow animate"><span>${s.annex?'Anexo':s.layout==='demo'?'Demo':`Workshop 0${s.chapter+1}`}</span><span class="slide-number">${String(s.local+1).padStart(2,'0')}</span></div><h1 class="animate" style="--i:1">${s.heading}</h1><div class="content">${content(s)}</div>${s.takeaway?`<p class="takeaway animate" style="--i:7">${esc(s.takeaway)}</p>`:''}${s.layout==='hero'?`<span class="hero-index" aria-hidden="true">0${s.chapter+1}</span>`:''}</article>`;
 $('slideTitle').textContent=s.title;$('counter').textContent=`${String(p+1).padStart(2,'0')} / ${q.length}`;$('prev').disabled=p===0;$('next').disabled=p===q.length-1;$('progress').style.width=`${(p+1)/q.length*100}%`;
 $('noteTitle').textContent=s.title;$('noteText').textContent=s.notes;$('originalText').textContent=s.text;$('showAnnex').checked=annex;
 document.querySelectorAll('[data-chapter]').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.chapter===s.chapter)));document.querySelectorAll('[data-slide]').forEach(b=>b.setAttribute('aria-current',String(+b.dataset.slide===current)));
 try{history.replaceState(null,'',`#${s.chapter+1}-${s.local+1}${annex?'&annex=1':''}`)}catch{}document.title=s.title+' · Avalanche';}
function go(i){if(!Number.isInteger(i)||!slides[i])return;current=i;if(slides[i].annex)annex=true;render()}
function step(d){const q=seq(),i=q.indexOf(current);if(q[i+d]!==undefined)go(q[i+d])}
function notes(open=$('notes').hidden){$('notes').hidden=!open;$('notesButton').setAttribute('aria-expanded',String(open));if(open)$('closeNotes').focus();else $('notesButton').focus()}
function closeMenu(){if($('indexDialog').open)$('indexDialog').close()}
async function exit(){document.body.classList.remove('immersive');if(document.fullscreenElement)await document.exitFullscreen().catch(()=>{})}
async function present(){if(document.body.classList.contains('immersive'))return exit();closeMenu();if(!$('notes').hidden)notes(false);document.body.classList.add('immersive');try{await document.documentElement.requestFullscreen()}catch{}}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('chapter0').onclick=()=>go(0);$('chapter1').onclick=()=>go(D[0].slides.length);$('menuButton').onclick=()=>$('indexDialog').showModal();$('closeMenu').onclick=closeMenu;$('notesButton').onclick=()=>notes();$('closeNotes').onclick=()=>notes(false);$('fullscreenButton').onclick=present;$('exit').onclick=exit;
$('showAnnex').onchange=e=>{annex=e.target.checked;if(!annex&&slides[current].annex)current=slides.findLastIndex(s=>s.chapter===slides[current].chapter&&!s.annex);render()};
$('indexDialog').addEventListener('click',e=>{if(e.target===$('indexDialog'))closeMenu()});
D.forEach((d,c)=>{const section=document.createElement('section');section.innerHTML=`<h3>0${c+1} / ${esc(d.title)}</h3>`;let list=document.createElement('ol');section.append(list);let annexHead=false;d.slides.forEach((s,i)=>{if(s.annex&&!annexHead){const label=document.createElement('p');label.className='annex-label';label.textContent='ANEXOS';section.append(label);list=document.createElement('ol');section.append(list);annexHead=true}const li=document.createElement('li'),b=document.createElement('button');b.dataset.slide=String((c?D[0].slides.length:0)+i);b.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span>${esc(s.title)}`;b.onclick=()=>{go(+b.dataset.slide);closeMenu()};li.append(b);list.append(li)});$('chapterLists').append(section)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='Escape'){if($('indexDialog').open)return;if(!$('notes').hidden)notes(false);exit();return}if($('indexDialog').open)return;const k=e.key.toLowerCase();if(k===' '&&e.target.closest('button,a,summary'))return;if(['arrowright','arrowdown','pagedown',' '].includes(k)){e.preventDefault();step(1)}else if(['arrowleft','arrowup','pageup'].includes(k)){e.preventDefault();step(-1)}else if(k==='home'){e.preventDefault();go(seq()[0])}else if(k==='end'){e.preventDefault();go(seq().at(-1))}else if(k==='m')$('menuButton').click();else if(k==='n')notes();else if(k==='f')present()});
$('stage').addEventListener('touchstart',e=>{touch=[e.touches[0].clientX,e.touches[0].clientY]},{passive:true});$('stage').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch[0],dy=e.changedTouches[0].clientY-touch[1];if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy))step(dx<0?1:-1);touch=null},{passive:true});$('stage').addEventListener('dblclick',e=>{if(!e.target.closest('a'))present()});document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('immersive')});window.addEventListener('hashchange',()=>{readHash();render()});readHash();render();
</script></body></html>
