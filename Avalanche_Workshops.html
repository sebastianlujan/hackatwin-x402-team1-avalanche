    "notes": "KUMPLY · IDENTIDAD DE AGENTES\nTIEMPO: 1 min\n\nKUMPLY emite atestaciones on-chain de identidad y cumplimiento para una dirección. KYC (tiers 1 a 3) son niveles de verificación de una persona. KYB (tier 4) confirma que la dirección es de una empresa. KYA (tier 5) es para direcciones que controla un agente de IA: responde si hay un operador verificado detrás. KYB y KYA son categorías aparte, no niveles superiores de KYC.\n\nPor qué importa acá: x402 resuelve el pago, no quién paga. Con KUMPLY, la API puede exigir antes del cobro que quien paga sea un agente con operador verificado.\n\nSDK: @kumply/sdk 1.3.0. new KumplyClient({ network: \"fuji\", contractAddress }), sin API key. isAgent(address) es true solo para tier 5; isBusiness, para tier 4; isPersonAtLeast(address, 1..3), para KYC.\n\nAVISO: en Fuji las atestaciones son de demo. Las emite el equipo de KUMPLY sin verificación real de identidad; un tier 5 de prueba no demuestra quién opera la dirección.\n\nFUENTES (consultadas el 6 de noviembre de 2026)\nKUMPLY — https://kumply.xyz\nKUMPLY · Developers — https://kumply.xyz/developers\nKUMPLY · Building with KUMPLY: KYC, KYB, KYA — https://kumply.xyz/blog/building-with-kumply-kyc-kyb-kya",
