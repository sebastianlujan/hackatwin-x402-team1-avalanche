name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1

  branch-name:
    name: branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Enforce gitflow branch names
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          name='[a-z0-9]+(-[a-z0-9]+)*'
          semver='[0-9]+\.[0-9]+\.[0-9]+'
          case "$BASE_REF" in
            develop) allowed="^(feature/${name}|release/${semver}|hotfix/${name}|dependabot/.+)$" ;;
            main) allowed="^(release/${semver}|hotfix/${name})$" ;;
            *) echo "::error::Unexpected base branch '$BASE_REF'"; exit 1 ;;
          esac
          if [[ ! "$HEAD_REF" =~ $allowed ]]; then
            echo "::error::'$HEAD_REF' cannot target '$BASE_REF'. See CONTRIBUTING.md."
            exit 1
          fi

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Validate JSON
        run: git ls-files -z '*.json' '*.excalidraw' | xargs -0 -r -n1 jq empty

  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      web: ${{ steps.filter.outputs.web }}
      demo-3: ${{ steps.filter.outputs.demo-3 }}
      ts: ${{ steps.filter.outputs.ts }}
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - &root
                - package.json
                - pnpm-lock.yaml
                - pnpm-workspace.yaml
                - tsconfig.base.json
                - biome.json
                - .nvmrc
                - .github/workflows/ci.yml
              - docs/**
              - apps/docs/**
              - packages/ui/**
            web:
              - *root
              - apps/web/**
              - packages/**
              - demos/01-*/**
            demo-3:
              - *root
              - demos/01-*/**
              - demos/02-*/**
              - demos/03-*/**
              - packages/**
            ts:
              - *root
              - test/**
              - vitest.config.ts
              - tsconfig.json
              - .env.example
              - packages/**
              - demos/**
              - apps/web/**
              - e2e/**
            contracts:
              - *root
              - packages/contracts/**
              - packages/chains/registry/**

  biome:
    name: biome
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: typecheck
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  fork:
    name: fork
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1
          cache: false
      - name: Read the pinned fork block
        id: block
        run: echo "number=$(node demos/01-x402-twin/scripts/fork-block.ts)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.foundry/cache/rpc
          key: foundry-rpc-43114-${{ steps.block.outputs.number }}
      - run: pnpm test:fork

  contracts:
    name: contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1
          cache: false
      - run: forge fmt --check
      - run: forge build
      - run: forge test
      - run: forge snapshot --check --tolerance 1 --match-path 'test/gas/*'
      - uses: smol-ninja/bulloak-toolchain@d4e00e1dc5673d3e6731ac37b8cdbb3f451863be # v2.2.0
        with:
          version: 0.9.2
          test-dir: packages/contracts/test
      - if: hashFiles('packages/contracts/src/**/*.sol') != ''
        uses: beeb/lintspec@a9e8a9437c74d8d4fd30a39e3d25197b98196264 # v0.20.0
        with:
          working-directory: packages/contracts
          version: 0.20.0
      - run: pnpm lint:sol
      - run: pnpm contracts:policy
        working-directory: .
      - name: ABI drift check
        working-directory: .
        run: |
          pnpm contracts:abi
          git diff --exit-code -- packages/contracts/abi

  contracts-dry-run:
    name: contracts dry-run
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/contracts
    env:
      CHAIN_REGISTRY_DIR: ./test/fixtures/registry
      DEPLOY_PARAMS_DIR: ./test/fixtures/params
      DEPLOY_DEPLOYMENTS_DIR: ./test/fixtures/deployments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1
          cache: false
      - name: Dry-run the L1 script on anvil
        run: |
          anvil --chain-id 100001 --silent &
          until cast chain-id --rpc-url http://127.0.0.1:8545 > /dev/null 2>&1; do sleep 1; done
          forge script script/DeployL1.s.sol:DeployL1 --fork-url http://127.0.0.1:8545
          test "$(cast block-number --rpc-url http://127.0.0.1:8545)" = 0
      - name: Dry-run the Fuji script on a Fuji fork (informational)
        continue-on-error: true
        env:
          FUJI_FORK: '1'
        run: forge test --match-contract UnitDeployFuji
      - name: Check the dry-runs wrote nothing
        working-directory: .
        run: test -z "$(git status --porcelain)"

  local:
    name: local
    needs: changes
    if: needs.changes.outputs.ts == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.5.1
          cache: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/icm-services
          key: icm-services-${{ hashFiles('e2e/protocol/src/local/icm-fetch.ts') }}
      - run: pnpm local:icm
      - name: Build the contracts that the local world deploys
        run: forge build
        working-directory: packages/contracts
      - run: pnpm test:local
      - name: Check the local tests wrote nothing tracked or unignored
        run: test -z "$(git status --porcelain)"

  docs-build:
    name: docs build
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs typecheck
      - run: pnpm --filter docs build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: docs-site
          path: apps/docs/build
          retention-days: 7

  web-build:
    name: web build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ANTHROPIC_API_KEY: hackatwin-sentinel-anthropic
      KEYSTORE_DIR: /tmp/hackatwin-sentinel-keystore
      CCHAIN_FORK_RPC_URL: http://127.0.0.1:8545/hackatwin-sentinel-fork
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hackatwin/web build
      - name: Scan the client bundle for secrets
        run: node apps/web/scripts/scan-static.ts

  ci-gate:
    name: ci-gate
    if: always()
    needs:
      [pr-title, commits, branch-name, lint, changes, biome, typecheck, test, fork, contracts, contracts-dry-run, local, docs-build, web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require every job to succeed or be skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
